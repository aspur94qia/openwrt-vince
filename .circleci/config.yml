version: 2.1

executors:
  openwrt-builder:
    docker:
      - image: cimg/base:2024.01
    resource_class: large # Menggunakan spesifikasi Large (8 vCPU / 32 GB RAM)

jobs:
  check-spec:
    executor: openwrt-builder
    steps:
      - run:
          name: Cek Spesifikasi Runner CircleCI
          command: |
            echo "=================== CPU INFO ==================="
            lscpu | grep -E "Model name|CPU\(s\):|Thread|Core|Socket|MHz" || nproc
            
            echo -e "\n=================== RAM INFO ==================="
            free -h
            
            echo -e "\n=================== DISK SPACE ==================="
            df -h /
            
            echo -e "\n=================== OS & KERNEL ==================="
            uname -a
            cat /etc/os-release | grep PRETTY_NAME

workflows:
  version: 2
  check-pipeline:
    jobs:
      - check-spec
