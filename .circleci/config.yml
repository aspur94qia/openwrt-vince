version: 2.1

executors:
  openwrt-builder:
    docker:
      - image: cimg/base:2024.01
    resource_class: large # Menggunakan 8 vCPU & 32 GB RAM

jobs:
  build:
    executor: openwrt-builder
    working_directory: ~/repo
    steps:
      - checkout

      - run:
          name: Install Build Dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
            autoconf automake libtool gperf help2man intltool patch pkgconf bzip2 xz-utils \
            libelf-dev libdw-dev libncurses-dev libssl-dev libglib2.0-dev libgmp3-dev libmpc-dev \
            libmpfr-dev libreadline-dev libltdl-dev python3 python3-setuptools \
            python3-dev python3-pyelftools python3-ply python3-docutils libpython3-dev re2c squashfs-tools \
            texinfo xmlto cmake ninja-build rsync subversion swig time u-boot-tools device-tree-compiler \
            unzip wget curl zstd flex bison ca-certificates xsltproc zlib1g-dev xxd p7zip-full

      - run:
          name: Clone OpenWrt Fork & Scaffold
          command: |
            rm -rf openwrt
            git clone --depth 1 --filter=blob:none -b master https://github.com/lkiuyu/immortalwrt openwrt
            if [ -d "overlay" ]; then
              cp -a overlay/. openwrt/
              rm -f openwrt/README.md
            fi
            bash ci/scaffold-msm8953.sh openwrt

      - run:
          name: Inject Configuration
          command: |
            cd openwrt
            cat << 'CONFIG_EOF' > .config
            CONFIG_TARGET_msm89xx=y
            CONFIG_TARGET_msm89xx_msm8953=y
            CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y
            CONFIG_DEVEL=y
            CONFIG_CCACHE=y
            CONFIG_PARALLEL_BUILDING=y
            CONFIG_TOOLCHAINOPTS=y
            CONFIG_AUTOREMOVE=y
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-compat=y
            CONFIG_PACKAGE_dropbear=y
            CONFIG_PACKAGE_kmod-wcn36xx=y
            CONFIG_PACKAGE_kmod-usb-gadget-eth=y
            CONFIG_PACKAGE_zram-swap=y
            CONFIG_PACKAGE_luci-app-ttyd=y
            CONFIG_EOF
            make defconfig

      - run:
          name: Update Feeds & Fast Download
          command: |
            cd openwrt
            ./scripts/feeds update packages luci
            ./scripts/feeds install -a -p packages
            ./scripts/feeds install -a -p luci
            make download -j8 WGET="wget --user-agent='Mozilla/5.0'" || make download -j1 V=s

      - run:
          name: Setup Tools & Toolchain Fast
          command: |
            cd openwrt
            make tools/install -j9 BUILD_TOOLCHAIN=0 || true
            if ! find staging_dir/toolchain-* -name "*gcc" 2>/dev/null | grep -q .; then
              make toolchain/install -j9 IGNORE_ERRORS=m || true
            fi

      - run:
          name: Pre-flight Inspection
          command: bash ci/inspect-preflight.sh openwrt

      - run:
          name: Build Firmware (8-Thread High-Speed)
          command: bash ci/build.sh openwrt

      - run:
          name: Package Flash Files
          command: bash ci/package-flash.sh openwrt

      - store_artifacts:
          path: flash-out/
          destination: vince-flash-package

workflows:
  version: 2
  build-pipeline:
    jobs:
      - build
