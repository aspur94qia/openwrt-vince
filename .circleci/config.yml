version: 2.1
executors:
  spec-checker:
    docker: [{image: "cimg/base:2024.01"}]
    resource_class: large
jobs:
  check-spec:
    executor: spec-checker
    steps:
      - run:
          name: SPEK CIRCLECI
          command: lscpu | grep -E "Model name|CPU\(s\):|Thread|Core" && free -h && df -h /
workflows:
  version: 2
  check:
    jobs: [check-spec]
