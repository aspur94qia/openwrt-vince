name: Build OpenWrt Vince (Port MSM8953)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_UNSAFE_CONFIGURE: 1
  FORK_URL: https://github.com/lkiuyu/immortalwrt
  FORK_BRANCH: master
  CCACHE_DIR: /tmp/.ccache
  CCACHE_MAXSIZE: 10G

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Install Build Dependencies Fast
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
          autoconf automake libtool gperf help2man intltool patch pkgconf bzip2 xz-utils \
          libelf-dev libdw-dev libncurses-dev libssl-dev libglib2.0-dev libgmp3-dev libmpc-dev \
          libmpfr-dev libreadline-dev libltdl-dev python3 python3-distutils python3-setuptools \
          python3-dev python3-pyelftools python3-ply python3-docutils libpython3-dev re2c squashfs-tools \
          texinfo xmlto cmake ninja-build rsync subversion swig time u-boot-tools device-tree-compiler \
          unzip wget curl zstd flex bison ca-certificates xsltproc zlib1g-dev xxd p7zip-full

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Init Logs & RAM Ccache Dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          mkdir -p /tmp/.ccache

      - name: Clone OpenWrt Fork (Fast Shallow Clone)
        run: |
          rm -rf openwrt
          git clone --depth 1 --filter=blob:none -b "$FORK_BRANCH" "$FORK_URL" openwrt

      - name: Cache OpenWrt DL & RAM Ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            /tmp/.ccache
          key: openwrt-vince-dl-ccache-v21-${{ runner.os }}

      - name: Apply Overlay & Scaffold Subtarget Vince
        run: |
          if [ -d "$GITHUB_WORKSPACE/overlay" ]; then
            cp -a "$GITHUB_WORKSPACE/overlay/." openwrt/
            rm -f openwrt/README.md
          fi
          bash ci/scaffold-msm8953.sh openwrt

      - name: Inject Configuration (Optimized Fast-Path)
        run: |
          cd openwrt
          cat << 'CONFIG_EOF' > .config
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8953=y
          CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PARALLEL_BUILDING=y
          CONFIG_TOOLCHAINOPTS=y
          CONFIG_AUTOREMOVE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_kmod-wcn36xx=y
          CONFIG_PACKAGE_kmod-usb-gadget-eth=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_EOF

          make defconfig

      - name: Update Feeds & Install Core Packages
        run: |
          cd openwrt
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

          for repo in luci-app-sms-tool-js luci-app-modemband; do
            if [ -z "$(find feeds -maxdepth 4 -type d -name "$repo" -print -quit)" ]; then
              for i in {1..3}; do
                git clone --depth 1 "https://github.com/4IceG/$repo.git" "package/$repo" && break || sleep 2
              done
            fi
          done

      - name: Inject Custom UCI & Secrets Fallback
        env:
          WIFI_SSID: OpenWrt-Vince
          WIFI_KEY: ${{ secrets.WIFI_KEY }}
          ROOT_PASS: ${{ secrets.ROOT_PASS }}
        run: |
          cd openwrt
          W_KEY="${WIFI_KEY:-vince12345}"
          R_PASS="${ROOT_PASS:-vince12345}"
          mkdir -p files/etc/uci-defaults
          cat << CUSTOM_EOF > files/etc/uci-defaults/99-vince-custom
          #!/bin/sh
          printf '%s\n%s\n' '$R_PASS' '$R_PASS' | passwd root >/dev/null 2>&1
          uci set network.lan.ipaddr='192.168.1.1'
          uci commit network
          wifi config
          for i in \$(uci show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.=]*\)=wifi-iface\$/\1/p'); do
              uci set wireless.\$i.mode='ap'
              uci set wireless.\$i.ssid='$WIFI_SSID'
              uci set wireless.\$i.key='$W_KEY'
              uci set wireless.\$i.disabled='0'
          done
          uci commit wireless
          exit 0
          CUSTOM_EOF
          chmod +x files/etc/uci-defaults/99-vince-custom

      - name: Download Sources Fast Parallel
        run: |
          cd openwrt
          JOBS=$(($(nproc) + 1))
          make download -j"$JOBS" WGET="wget --user-agent='Mozilla/5.0'" || make download -j1 V=s

      - name: Setup Pre-built Tools & Toolchain Fast
        run: |
          cd openwrt
          JOBS=$(($(nproc) + 1))
          make tools/install -j"$JOBS" BUILD_TOOLCHAIN=0 || true
          
          if ! find staging_dir/toolchain-* -name "*gcc" 2>/dev/null | grep -q .; then
            make toolchain/install -j"$JOBS" IGNORE_ERRORS=m || true
          fi

      - name: Pengecekan Pra-Build Total (Pre-flight Check)
        run: bash ci/inspect-preflight.sh openwrt

      - name: Build Firmware (High-Speed Single Pass)
        run: bash ci/build.sh openwrt

      - name: Package Flash Files
        if: success()
        run: bash ci/package-flash.sh openwrt

      - name: Upload Flash Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vince-flash-package
          path: flash-out/

      - name: Upload CI Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
