name: Fast Build OpenWrt Vince

on:
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
          libelf-dev libncurses-dev libssl-dev python3 python3-distutils python3-setuptools \
          python3-dev rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: Clone OpenWrt Repo (Shallow Clone)
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt

      # Cache folder DL dan Ccache untuk mempercepat run berikutnya
      - name: Cache OpenWrt Downloads & Tools
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup Auto Hotspot & Optimized Config
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults

          # Skrip uci-defaults agar Wi-Fi AP otomatis aktif tanpa sandi
          cat << 'WIFI_EOF' > files/etc/uci-defaults/99-autohotspot
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload
          exit 0
          WIFI_EOF
          chmod +x files/etc/uci-defaults/99-autohotspot

          # Konfigurasi ringkas & aktifkan CCache
          echo "CONFIG_TARGET_msm89xx=y" > .config
          echo "CONFIG_TARGET_msm89xx_msm8953=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_PACKAGE_kmod-wcn36xx=y" >> .config
          echo "CONFIG_PACKAGE_hostapd=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-fast-firmware
          path: openwrt/bin/targets/
