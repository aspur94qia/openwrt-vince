name: Build OpenWrt Vince via Image Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build-ib:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Complete Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 wget curl

      - name: Setup Custom Files & Verify Presence
        run: |
          mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults files/etc/nftables.d files/etc/sysctl.d

          # 1. LED Status Monitor Daemon
          cat << 'LED_SCRIPT' > files/usr/bin/led-status-monitor.sh
          #!/bin/sh
          LED_DIR="/sys/class/leds/white:status"
          if [ ! -f "$LED_DIR/brightness" ]; then
              LED_DIR=$(ls -d /sys/class/leds/* 2>/dev/null | grep -viE 'flash|torch|backlight|lcd|button|kbd' | head -n 1)
          fi
          LED="$LED_DIR/brightness"
          [ -f "$LED" ] || exit 0

          blink() {
              COUNT=$1
              DELAY=${2:-0.2}
              for i in $(seq 1 $COUNT); do
                  echo 255 > "$LED" 2>/dev/null
                  sleep $DELAY
                  echo 0 > "$LED" 2>/dev/null
                  sleep $DELAY
              done
          }

          while true; do
              AP_ACTIVE=$(ubus call network.wireless status 2>/dev/null | grep -c '"up": true')
              SIM_UP=$(ifstatus wan_sim 2>/dev/null | jsonfilter -e '@.up' 2>/dev/null)

              if [ "$AP_ACTIVE" -gt 0 ]; then
                  blink 3 0.15
                  sleep 1.5
              elif [ "$SIM_UP" = "true" ]; then
                  blink 1 0.2
                  sleep 1.5
              else
                  blink 5 0.1
                  sleep 1
              fi
          done
          LED_SCRIPT
          chmod +x files/usr/bin/led-status-monitor.sh

          # 2. Layanan Init LED Monitor
          cat << 'LED_SERVICE' > files/etc/init.d/led-status
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1
          start_service() {
              procd_open_instance
              procd_set_param command /usr/bin/led-status-monitor.sh
              procd_set_param respawn
              procd_close_instance
          }
          LED_SERVICE
          chmod +x files/etc/init.d/led-status

          # 3. Battery Bypass Service
          cat << 'BATTERY_EOF' > files/etc/init.d/battery-bypass
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              B=/sys/class/power_supply/battery
              [ -d "$B" ] || return 0
              echo 0 > "$B/input_suspend" 2>/dev/null || true
              echo 0 > "$B/charging_enabled" 2>/dev/null || true
          }
          BATTERY_EOF
          chmod +x files/etc/init.d/battery-bypass

          # 4. Sysctl BBR
          cat << 'SYSCTL_EOF' > files/etc/sysctl.d/99-network-speed.conf
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          SYSCTL_EOF

          # 5. Skrip uci-defaults Auto Setup
          cat << 'CUSTOM_EOF' > files/etc/uci-defaults/99-vince-custom
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='vince12345'
          uci commit wireless

          MODEM_DEV=$(readlink -f /sys/class/net/wwan0/device 2>/dev/null)
          uci set network.wan_sim=interface
          uci set network.wan_sim.proto='modemmanager'
          [ -n "$MODEM_DEV" ] && uci set network.wan_sim.device="$MODEM_DEV"
          uci set network.wan_sim.apn='internet'
          uci set network.wan_sim.auth='none'
          uci commit network

          uci add_list firewall.@zone[1].network='wan_sim'
          uci commit firewall

          uci set system.@system[0].zram_size_mb='1024'
          uci commit system

          [ -s /etc/config/fstab ] || block detect > /etc/config/fstab
          uci set fstab.@global[0].anon_mount='1'
          uci set fstab.@global[0].auto_mount='1'
          uci set fstab.@global[0].auto_swap='1'
          uci commit fstab

          /etc/init.d/battery-bypass enable
          /etc/init.d/battery-bypass start
          /etc/init.d/led-status enable
          /etc/init.d/led-status start
          exit 0
          CUSTOM_EOF
          chmod +x files/etc/uci-defaults/99-vince-custom

          # 6. Firewall TTL 64
          cat << 'NFT_EOF' > files/etc/nftables.d/10-ttl-bypass.nft
          chain mangle_postrouting_ttl64 {
              type filter hook postrouting priority 300; policy accept;
              counter ip ttl set 64
              counter ip6 hoplimit set 64
          }
          NFT_EOF

          # Inject LuCI Apps Kustom
          git clone --depth 1 https://github.com/4nhung/luci-app-sms-tool-js.git /tmp/sms-tool || true
          [ -d /tmp/sms-tool/htdocs ] && cp -rf /tmp/sms-tool/htdocs/* files/ 2>/dev/null || true
          [ -d /tmp/sms-tool/root ] && cp -rf /tmp/sms-tool/root/* files/ 2>/dev/null || true

          git clone --depth 1 https://github.com/4nhung/luci-app-modemband.git /tmp/modemband || true
          [ -d /tmp/modemband/htdocs ] && cp -rf /tmp/modemband/htdocs/* files/ 2>/dev/null || true
          [ -d /tmp/modemband/root ] && cp -rf /tmp/modemband/root/* files/ 2>/dev/null || true

          # VERIFIKASI FISIK FILE KUSTOM
          for f in files/usr/bin/led-status-monitor.sh \
                   files/etc/init.d/led-status \
                   files/etc/init.d/battery-bypass \
                   files/etc/sysctl.d/99-network-speed.conf \
                   files/etc/uci-defaults/99-vince-custom \
                   files/etc/nftables.d/10-ttl-bypass.nft; do
            if [ ! -f "$f" ]; then
              echo "::error::[VERIFIKASI GAGAL] File $f tidak berhasil dibuat!"
              exit 1
            fi
          done
          echo "::notice::[VERIFIKASI SUKSES] Seluruh file kustom terverifikasi 100%."

      - name: Clone Repo & Lock Target MSM89xx
        run: |
          git clone --depth 1 https://github.com/lkiuyu/immortalwrt.git openwrt
          cp -rf files openwrt/files

          cd openwrt
          if [ ! -d "target/linux/msm89xx" ]; then
            echo "::error::[VERIFIKASI GAGAL] Target MSM89xx/MSM8953 tidak ditemukan di repo!"
            exit 1
          fi

          echo "CONFIG_TARGET_msm89xx=y" > .config
          echo "CONFIG_TARGET_ALL_PROFILES=y" >> .config
          make defconfig

          if ! grep -q "CONFIG_TARGET_msm89xx=y" .config; then
            echo "::error::[VERIFIKASI GAGAL] Target msm89xx gagal terkunci di .config!"
            exit 1
          fi
          echo "::notice::[VERIFIKASI SUKSES] Target terverifikasi khusus MSM89xx (Snapdragon 625)."

      - name: Build Firmware via Image Builder Engine
        run: |
          cd openwrt

          PACKAGES="luci luci-compat dropbear \
          kmod-wcn36xx hostapd \
          kmod-tcp-bbr sqm-scripts luci-app-sqm \
          luci-app-travelmate relayd luci-proto-relay \
          modemmanager luci-proto-modemmanager qmi-utils mbim-utils sms-tool usb-modeswitch \
          kmod-usb-net-qmi-wwan kmod-usb-net-cdc-ether kmod-usb-net-rndis kmod-usb-serial-option kmod-usb-serial-qualcomm \
          kmod-usb-storage kmod-usb2 kmod-usb3 block-mount kmod-fs-ext4 kmod-fs-f2fs kmod-fs-exfat fdisk \
          kmod-nft-offload mwan3 luci-app-mwan3 wireguard-tools kmod-wireguard luci-proto-wireguard zerotier luci-app-zerotier \
          zram-swap aria2 luci-app-aria2 luci-app-statistics luci-app-ttyd"

          VINCE_PROFILE=$(grep -rn "DEVICE.*vince" target/linux/msm89xx/ 2>/dev/null | head -n 1 | sed -n 's/.*Device\/\(.*\)/\1/p')
          [ -z "$VINCE_PROFILE" ] && VINCE_PROFILE="xiaomi_vince"

          echo "::notice::Device profile terdeteksi: $VINCE_PROFILE"
          make image PROFILE="$VINCE_PROFILE" PACKAGES="$PACKAGES" FILES="files" || make image PACKAGES="$PACKAGES" FILES="files"

      - name: Verify Generated Images
        run: |
          cd openwrt
          echo "=== Verifikasi Hasil File Image ==="
          ls -la bin/targets/msm89xx/* 2>/dev/null || true

          IMAGE_COUNT=$(find bin/targets/msm89xx/ -type f \( -name "*.img" -o -name "*.bin" -o -name "*squashfs*" \) 2>/dev/null | wc -l)
          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "::error::[VERIFIKASI GAGAL] Tidak ditemukan file image firmware di bin/targets/msm89xx!"
            exit 1
          fi
          echo "::notice::[VERIFIKASI SUKSES] Berhasil membuat $IMAGE_COUNT file image untuk Vince."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-ib-firmware
          path: openwrt/bin/targets/
