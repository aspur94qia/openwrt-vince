name: Complete OpenWrt Vince Source Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
          libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
          python3-dev rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev zstd

      - name: Clone OpenWrt MSM89xx Repository
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/akbar-npj/msm8916-openwrt.git openwrt || \
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup Headless Config Files
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults

          # 1. LED Status Indikator (Kedip Heartbeat)
          cat << 'LED_EOF' > files/etc/uci-defaults/96-leds
          #!/bin/sh
          for led in /sys/class/leds/*; do
            case "$led" in
              *red*|*white*|*blue*|*green*|*notification*)
                echo heartbeat > "$led/trigger" 2>/dev/null || true
                ;;
            esac
          done
          exit 0
          LED_EOF
          chmod +x files/etc/uci-defaults/96-leds

          # 2. Auto Hotspot Wi-Fi AP
          cat << 'WIFI_EOF' > files/etc/uci-defaults/99-autohotspot
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload
          exit 0
          WIFI_EOF
          chmod +x files/etc/uci-defaults/99-autohotspot

          # 3. Auto TTL 64 Fix
          cat << 'TTL_EOF' > files/etc/uci-defaults/98-autottl
          #!/bin/sh
          uci -q get firewall.ttl_fix && exit 0
          uci add firewall include
          uci set firewall.@include[-1].path='/etc/firewall.user'
          uci commit firewall
          
          cat << 'FW_EOF' >> /etc/firewall.user
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true
          nft add rule inet fw4 mangle_postrouting ip ttl set 64 2>/dev/null || true
          FW_EOF
          exit 0
          TTL_EOF
          chmod +x files/etc/uci-defaults/98-autottl

          # 4. ZRAM 512MB & Auto Mount
          cat << 'SYS_EOF' > files/etc/uci-defaults/97-system
          #!/bin/sh
          uci set system.@system[0].zram_size_mb='512'
          uci commit system
          /etc/init.d/zram enable 2>/dev/null || true
          /etc/init.d/fstab enable 2>/dev/null || true
          exit 0
          SYS_EOF
          chmod +x files/etc/uci-defaults/97-system

      - name: Generate and Verify MSM8953 Target Config
        run: |
          cd openwrt
          
          # Tentukan target sesuai arsitektur msm89xx / msm8953
          echo "CONFIG_TARGET_msm89xx=y" > .config
          echo "CONFIG_TARGET_msm89xx_msm8953=y" >> .config
          echo "CONFIG_TARGET_DEVICE_msm89xx_msm8953_DEVICE_xiaomi_vince=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          
          # Paket pendukung hardware Vince
          echo "CONFIG_PACKAGE_kmod-wcn36xx=y" >> .config
          echo "CONFIG_PACKAGE_hostapd=y" >> .config
          echo "CONFIG_PACKAGE_hostapd-common=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
          echo "CONFIG_PACKAGE_uqmi=y" >> .config
          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-qmi=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qmi-wwan=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          echo "CONFIG_PACKAGE_kmod-bluetooth=y" >> .config
          echo "CONFIG_PACKAGE_bluez-utils=y" >> .config
          echo "CONFIG_PACKAGE_bluez-daemon=y" >> .config
          echo "CONFIG_PACKAGE_alsa-utils=y" >> .config
          echo "CONFIG_PACKAGE_kmod-leds-gpio=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ledtrig-heartbeat=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-f2fs=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_f2fs-tools=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-ipopt=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-ipopt=y" >> .config
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config

          make defconfig

          # Verifikasi Target: Cek apakah target MSM89xx/MSM8953 aktif di .config
          if ! grep -q "CONFIG_TARGET_msm89xx=y" .config && ! grep -q "CONFIG_TARGET_msm89xx_msm8953=y" .config; then
            echo "::error ::Target MSM8953 tidak ditemukan atau ter-reset oleh defconfig! Memeriksa opsi target yang tersedia..."
            grep -i "msm89" target/linux/msm89xx/Makefile || true
            exit 1
          fi
          echo "Verifikasi Target Berhasil: Target terkonfirmasi untuk MSM8953 (Xiaomi Vince)."

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile OpenWrt Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Prepare Final Output Artifacts
        run: |
          mkdir -p bin_output
          curl -f -sSL -o bin_output/lk2nd-msm8953.img https://github.com/msm8916-mainline/lk2nd/releases/download/23.1/lk2nd-msm8953.img || \
          curl -f -sSL -o bin_output/lk2nd-msm8953.img https://github.com/msm8916-mainline/lk2nd/releases/latest/download/lk2nd-msm8953.img
          
          cp openwrt/bin/targets/msm89xx/msm8953/* bin_output/ 2>/dev/null || \
          cp openwrt/bin/targets/*/*/* bin_output/ 2>/dev/null || true

      - name: Upload Complete Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-full-pack
          path: bin_output/
