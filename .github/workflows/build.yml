name: Build OpenWrt Vince Master MSM8953

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install Complete Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
          libelf-dev libdw-dev libncurses-dev libssl-dev python3 python3-distutils python3-setuptools \
          python3-dev python3-pyelftools libpython3-dev rsync subversion swig time u-boot-tools \
          device-tree-compiler unzip wget curl flex bison ca-certificates xsltproc zlib1g-dev

      - name: Clone OpenWrt Repo (MSM89xx Supported Fork)
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/lkiuyu/immortalwrt.git openwrt

      - name: Restore Download & ccache Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: openwrt-vince-${{ github.run_id }}
          restore-keys: |
            openwrt-vince-

      - name: Update & Install Feeds + Custom LuCI Apps
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Clone hanya kalau paket belum ada di feeds
          for repo in luci-app-sms-tool-js luci-app-modemband; do
            if ! find feeds -maxdepth 4 -type d -name "$repo" | grep -q .; then
              git clone --depth 1 "https://github.com/4nhung/$repo.git" "package/$repo" \
                || echo "::warning::Gagal clone $repo, paket ini tidak akan masuk firmware"
            fi
          done

      - name: Inject Files (LED, Battery, Sysctl, UCI Defaults, TTL)
        run: |
          cd openwrt
          mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults files/etc/nftables.d files/etc/sysctl.d

          # 1. LED Status Monitor Daemon
          cat << 'LED_SCRIPT' > files/usr/bin/led-status-monitor.sh
          #!/bin/sh
          LED_DIR="/sys/class/leds/white:status"
          if [ ! -f "$LED_DIR/brightness" ]; then
              # Cari LED lain, hindari flash/torch/backlight
              LED_DIR=$(ls -d /sys/class/leds/* 2>/dev/null | grep -viE 'flash|torch|backlight|lcd|button|kbd' | head -n 1)
          fi
          LED="$LED_DIR/brightness"
          [ -f "$LED" ] || exit 0

          blink() {
              COUNT=$1
              DELAY=${2:-0.2}
              for i in $(seq 1 $COUNT); do
                  echo 255 > "$LED" 2>/dev/null
                  sleep $DELAY
                  echo 0 > "$LED" 2>/dev/null
                  sleep $DELAY
              done
          }

          while true; do
              AP_ACTIVE=$(ubus call network.wireless status 2>/dev/null | grep -c '"up": true')
              SIM_UP=$(ifstatus wan_sim 2>/dev/null | jsonfilter -e '@.up' 2>/dev/null)

              if [ "$AP_ACTIVE" -gt 0 ]; then
                  blink 3 0.15
                  sleep 1.5
              elif [ "$SIM_UP" = "true" ]; then
                  blink 1 0.2
                  sleep 1.5
              else
                  blink 5 0.1
                  sleep 1
              fi
          done
          LED_SCRIPT
          chmod +x files/usr/bin/led-status-monitor.sh

          # 2. Layanan Init LED Monitor (procd, bisa start/stop/respawn)
          cat << 'LED_SERVICE' > files/etc/init.d/led-status
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1
          start_service() {
              procd_open_instance
              procd_set_param command /usr/bin/led-status-monitor.sh
              procd_set_param respawn
              procd_close_instance
          }
          LED_SERVICE
          chmod +x files/etc/init.d/led-status

          # 3. Battery Bypass Service (stop charge, TETAP ambil daya dari USB)
          cat << 'BATTERY_EOF' > files/etc/init.d/battery-bypass
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              B=/sys/class/power_supply/battery
              [ -d "$B" ] || return 0
              echo 0 > "$B/input_suspend" 2>/dev/null || true
              echo 0 > "$B/charging_enabled" 2>/dev/null || true
          }
          BATTERY_EOF
          chmod +x files/etc/init.d/battery-bypass

          # 4. Sysctl BBR
          cat << 'SYSCTL_EOF' > files/etc/sysctl.d/99-network-speed.conf
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          SYSCTL_EOF

          # 5. Skrip uci-defaults Auto Setup
          cat << 'CUSTOM_EOF' > files/etc/uci-defaults/99-vince-custom
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='vince12345'
          uci commit wireless

          # Path modem dideteksi otomatis kalau ada, kalau tidak isi manual lewat LuCI
          MODEM_DEV=$(readlink -f /sys/class/net/wwan0/device 2>/dev/null)
          uci set network.wan_sim=interface
          uci set network.wan_sim.proto='modemmanager'
          [ -n "$MODEM_DEV" ] && uci set network.wan_sim.device="$MODEM_DEV"
          uci set network.wan_sim.apn='internet'
          uci set network.wan_sim.auth='none'
          uci commit network

          # Masukkan wan_sim ke zona firewall wan supaya klien LAN bisa internetan
          uci add_list firewall.@zone[1].network='wan_sim'
          uci commit firewall

          uci set system.@system[0].zram_size_mb='1024'
          uci commit system

          [ -s /etc/config/fstab ] || block detect > /etc/config/fstab
          uci set fstab.@global[0].anon_mount='1'
          uci set fstab.@global[0].auto_mount='1'
          uci set fstab.@global[0].auto_swap='1'
          uci commit fstab

          /etc/init.d/battery-bypass enable
          /etc/init.d/battery-bypass start
          /etc/init.d/led-status enable
          /etc/init.d/led-status start
          exit 0
          CUSTOM_EOF
          chmod +x files/etc/uci-defaults/99-vince-custom

          # 6. Firewall TTL 64 (nama chain unik agar tidak bentrok dengan fw4)
          cat << 'NFT_EOF' > files/etc/nftables.d/10-ttl-bypass.nft
          chain mangle_postrouting_ttl64 {
              type filter hook postrouting priority 300; policy accept;
              counter ip ttl set 64
              counter ip6 hoplimit set 64
          }
          NFT_EOF

      - name: Inject Configuration & Lock Target MSM8953
        run: |
          cd openwrt

          cat << 'CONFIG_EOF' > my.config
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8953=y
          CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y

          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_dropbear=y

          CONFIG_PACKAGE_kmod-wcn36xx=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_wpad-mbedtls=y

          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y

          CONFIG_PACKAGE_luci-app-travelmate=y
          CONFIG_PACKAGE_relayd=y
          CONFIG_PACKAGE_luci-proto-relay=y

          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_qmi-utils=y
          CONFIG_PACKAGE_mbim-utils=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_luci-app-sms-tool-js=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_fdisk=y

          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y

          CONFIG_PACKAGE_simple-adblock=y
          CONFIG_PACKAGE_luci-app-simple-adblock=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_aria2=y
          CONFIG_PACKAGE_luci-app-aria2=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_kmod-bluetooth=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_kmod-sound-core=y
          CONFIG_PACKAGE_alsa-utils=y
          CONFIG_PACKAGE_pulseaudio-daemon=y
          CONFIG_EOF

          cp my.config .config
          make defconfig

          # Laporkan simbol yang dibuang defconfig (paket tidak ada / nama salah)
          grep -E '^CONFIG_' my.config | while read -r line; do
            grep -qxF "$line" .config || echo "::warning::Hilang setelah defconfig: $line"
          done

      # VERIFIKASI TARGET & DEVICE
      - name: Verify Architecture Safety Guard
        run: |
          cd openwrt
          echo "Subtarget msm89xx tersedia:"
          ls target/linux/msm89xx 2>/dev/null || true
          if ! grep -q "CONFIG_TARGET_msm89xx=y" .config; then
            echo "::error::[FATAL] Target bukan msm89xx."
            grep "CONFIG_TARGET_" .config | head -n 5
            exit 1
          fi
          if ! grep -q "CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y" .config; then
            echo "::error::[FATAL] Device xiaomi_vince tidak terpilih. Cek nama device di fork ini:"
            grep -rn "vince" target/linux/msm89xx | head -n 10 || true
            grep "CONFIG_TARGET_" .config | head -n 10
            exit 1
          fi
          echo "::notice::[SUCCESS] Target terverifikasi: msm89xx / MSM8953 / xiaomi_vince"

      # HOST TOOLS (dengan fallback fix elfutils obstack)
      - name: Build Host Tools
        run: |
          cd openwrt
          if ! make tools/install -j$(nproc) V=s; then
            echo "::warning::Host tools gagal, mencoba fix obstack elfutils"
            for f in $(find build_dir/host -path '*elfutils*' -name 'obstack*.h' 2>/dev/null); do
              echo "Patch: $f"
              sed -i 's/#if @HAVE_OBSTACK_PRINTF@/#if 0/g' "$f"
            done
            make tools/install -j1 V=s
          fi

      # KOMPILASI UTAMA
      - name: Compile Firmware
        run: |
          cd openwrt
          make download -j8 V=s || make download -j1 V=s
          make -j$(nproc) V=s || make -j1 V=s

      - name: Save Download & ccache Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: openwrt-vince-${{ github.run_id }}

      - name: Upload Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-logs
          path: openwrt/logs/
          if-no-files-found: ignore

      # UPLOAD ARTIFACT
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-master-firmware
          path: openwrt/bin/targets/
