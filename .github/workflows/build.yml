name: Complete OpenWrt Vince ImageBuilder (Full Hardware)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip wget curl python3 zstd

      - name: Setup Headless Config (LEDs, Audio, Storage, Hotspot, TTL, ZRAM)
        run: |
          mkdir -p files/etc/uci-defaults

          # 1. Skrip LED Status Indikator (Kedip Heartbeat)
          cat << 'LED_EOF' > files/etc/uci-defaults/96-leds
          #!/bin/sh
          for led in /sys/class/leds/*; do
            case "$led" in
              *red*|*white*|*blue*|*green*|*notification*)
                echo heartbeat > "$led/trigger" 2>/dev/null || true
                ;;
            esac
          done
          exit 0
          LED_EOF
          chmod +x files/etc/uci-defaults/96-leds

          # 2. Skrip Auto-Hotspot (Wi-Fi AP)
          cat << 'WIFI_EOF' > files/etc/uci-defaults/99-autohotspot
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload
          exit 0
          WIFI_EOF
          chmod +x files/etc/uci-defaults/99-autohotspot

          # 3. Skrip Auto TTL 64 (Bypass Kuota Hotspot/Tethering)
          cat << 'TTL_EOF' > files/etc/uci-defaults/98-autottl
          #!/bin/sh
          uci -q get firewall.ttl_fix && exit 0
          uci add firewall include
          uci set firewall.@include[-1].path='/etc/firewall.user'
          uci commit firewall
          
          cat << 'FW_EOF' >> /etc/firewall.user
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true
          nft add rule inet fw4 mangle_postrouting ip ttl set 64 2>/dev/null || true
          FW_EOF
          exit 0
          TTL_EOF
          chmod +x files/etc/uci-defaults/98-autottl

          # 4. Skrip Kompresi ZRAM Swap & Auto Mount Storage
          cat << 'SYS_EOF' > files/etc/uci-defaults/97-system
          #!/bin/sh
          uci set system.@system[0].zram_size_mb='512'
          uci commit system
          /etc/init.d/zram enable 2>/dev/null || true
          /etc/init.d/fstab enable 2>/dev/null || true
          exit 0
          SYS_EOF
          chmod +x files/etc/uci-defaults/97-system

      - name: Download ImageBuilder & lk2nd
        run: |
          mkdir -p bin_output

          # Download Bootloader lk2nd MSM8953
          curl -f -sSL -o bin_output/lk2nd-msm8953.img https://github.com/msm8916-mainline/lk2nd/releases/latest/download/lk2nd-msm8953.img || true

          # Download ImageBuilder dengan Validasi File
          URLS=(
            "https://github.com/akbar-npj/msm8916-openwrt/releases/download/v23.05.0/openwrt-imagebuilder-msm89xx-msm8953.Linux-x86_64.tar.xz"
            "https://downloads.openwrt.org/snapshots/targets/msm89xx/msm8953/openwrt-imagebuilder-msm89xx-msm8953.Linux-x86_64.tar.zst"
          )

          DOWNLOAD_OK=0
          for url in "${URLS[@]}"; do
            echo "Mencoba mengunduh dari: $url"
            rm -f ib_archive*
            if curl -f -sSL -o ib_archive "$url"; then
              SIZE=$(stat -c%s "ib_archive" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 5000000 ]; then
                echo "Berhasil mengunduh ImageBuilder valid ($(expr $SIZE / 1048576) MB)"
                DOWNLOAD_OK=1
                break
              fi
            fi
          done

          if [ $DOWNLOAD_OK -ne 1 ]; then
            echo "Error: Gagal mengunduh ImageBuilder dari semua mirror!"
            exit 1
          fi

          tar -xf ib_archive
          cd openwrt-imagebuilder-*

          # Salin konfigurasi uci-defaults
          cp -r ../files .

          # Paket Hardware Vince yang Kompatibel:
          PACKAGES_LIST="kmod-wcn36xx hostapd hostapd-common luci dropbear \
          kmod-usb-net-rndis kmod-usb-net-cdc-ether \
          uqmi modemmanager luci-proto-qmi luci-proto-modemmanager kmod-qmi-wwan kmod-usb-serial-option \
          kmod-bluetooth bluez-utils alsa-utils \
          kmod-leds-gpio kmod-ledtrig-heartbeat \
          block-mount kmod-fs-ext4 kmod-fs-f2fs kmod-fs-vfat e2fsprogs f2fs-tools \
          iptables-mod-ipopt kmod-ipt-ipopt zram-swap"

          # Rakit Firmware Instant
          make image PROFILE="xiaomi_vince" PACKAGES="$PACKAGES_LIST" FILES="files" || \
          make image PACKAGES="$PACKAGES_LIST" FILES="files"

          # Pindahkan hasil build firmware ke folder output
          cp bin/targets/msm89xx/msm8953/* ../bin_output/ 2>/dev/null || cp bin/targets/*/*/* ../bin_output/ 2>/dev/null || true

      - name: Upload Full Hardware Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-full-hardware-pack
          path: bin_output/
