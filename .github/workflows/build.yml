name: Complete OpenWrt Vince ImageBuilder (Full Hardware)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip wget python3

      - name: Setup Headless Config (LEDs, Audio, Storage, Hotspot, TTL, ZRAM)
        run: |
          mkdir -p files/etc/uci-defaults

          # 1. Skrip LED Status Indikator (Ganti fungsi LCD)
          cat << 'LED_EOF' > files/etc/uci-defaults/96-leds
          #!/bin/sh
          # Set LED depan berkedip heartbeat saat OpenWrt menyala
          for led in /sys/class/leds/*; do
            case "$led" in
              *red*|*white*|*blue*|*green*|*notification*)
                echo heartbeat > "$led/trigger" 2>/dev/null || true
                ;;
            esac
          done
          exit 0
          LED_EOF
          chmod +x files/etc/uci-defaults/96-leds

          # 2. Skrip Auto-Hotspot (Wi-Fi AP)
          cat << 'WIFI_EOF' > files/etc/uci-defaults/99-autohotspot
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload
          exit 0
          WIFI_EOF
          chmod +x files/etc/uci-defaults/99-autohotspot

          # 3. Skrip Auto TTL 64 (Bypass Kuota Hotspot/Tethering)
          cat << 'TTL_EOF' > files/etc/uci-defaults/98-autottl
          #!/bin/sh
          uci -q get firewall.ttl_fix && exit 0
          uci add firewall include
          uci set firewall.@include[-1].path='/etc/firewall.user'
          uci commit firewall
          
          cat << 'FW_EOF' >> /etc/firewall.user
          iptables -t mangle -A POSTROUTING -j TTL --ttl-set 64 2>/dev/null || true
          nft add rule inet fw4 mangle_postrouting ip ttl set 64 2>/dev/null || true
          FW_EOF
          exit 0
          TTL_EOF
          chmod +x files/etc/uci-defaults/98-autottl

          # 4. Skrip Kompresi ZRAM Swap & Auto Mount Storage
          cat << 'SYS_EOF' > files/etc/uci-defaults/97-system
          #!/bin/sh
          uci set system.@system[0].zram_size_mb='512'
          uci commit system
          /etc/init.d/zram enable 2>/dev/null || true
          /etc/init.d/fstab enable 2>/dev/null || true
          exit 0
          SYS_EOF
          chmod +x files/etc/uci-defaults/97-system

      - name: Download ImageBuilder & lk2nd
        run: |
          mkdir -p bin_output

          # Download Bootloader lk2nd MSM8953
          wget -q -O bin_output/lk2nd-msm8953.img https://github.com/msm8916-mainline/lk2nd/releases/latest/download/lk2nd-msm8953.img

          # Download ImageBuilder OpenWrt MSM89xx
          wget -q https://github.com/akbar-npj/msm8916-openwrt/releases/download/v23.05.0/openwrt-imagebuilder-msm89xx-msm8953.Linux-x86_64.tar.xz || \
          wget -q https://downloads.openwrt.org/snapshots/targets/msm89xx/msm8953/openwrt-imagebuilder-msm89xx-msm8953.Linux-x86_64.tar.zst
          
          tar -xf openwrt-imagebuilder-*
          cd openwrt-imagebuilder-*

          # Salin konfigurasi uci-defaults
          cp -r ../files .

          # Paket Hardware Vince Lengkap:
          # - Wi-Fi & AP: kmod-wcn36xx hostapd hostapd-common luci dropbear
          # - USB Tether: kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-gadget-eth
          # - SIM 4G: uqmi modemmanager luci-proto-qmi luci-proto-modemmanager kmod-qmi-wwan kmod-usb-serial-option
          # - Bluetooth & Audio/Loudspeaker/Headset: kmod-bluetooth bluez-utils bluez-daemon bluealsa alsa-utils kmod-sound-core
          # - LED & Senter: kmod-leds-gpio kmod-ledtrig-heartbeat kmod-ledtrig-netdev kmod-ledtrig-timer kmod-ledtrig-default-on
          # - Storage & Memori Internal: block-mount kmod-fs-ext4 kmod-fs-f2fs kmod-fs-vfat kmod-fs-exfat e2fsprogs f2fs-tools dosfstools
          # - TTL & ZRAM: iptables-mod-ipopt kmod-ipt-ipopt zram-swap kmod-zram kmod-tcp-bbr
          
          PACKAGES_LIST="kmod-wcn36xx hostapd hostapd-common luci dropbear \
          kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-gadget-eth \
          uqmi modemmanager luci-proto-qmi luci-proto-modemmanager kmod-qmi-wwan kmod-usb-serial-option \
          kmod-bluetooth bluez-utils bluez-daemon bluealsa alsa-utils kmod-sound-core \
          kmod-leds-gpio kmod-ledtrig-heartbeat kmod-ledtrig-netdev kmod-ledtrig-timer kmod-ledtrig-default-on \
          block-mount kmod-fs-ext4 kmod-fs-f2fs kmod-fs-vfat kmod-fs-exfat e2fsprogs f2fs-tools dosfstools \
          iptables-mod-ipopt kmod-ipt-ipopt zram-swap kmod-zram kmod-tcp-bbr"

          # Rakit Firmware Instant
          make image PROFILE="xiaomi_vince" PACKAGES="$PACKAGES_LIST" FILES="files" || \
          make image PACKAGES="$PACKAGES_LIST" FILES="files"

          # Pindahkan hasil build firmware ke folder output
          cp bin/targets/msm89xx/msm8953/* ../bin_output/ 2>/dev/null || cp bin/targets/*/*/* ../bin_output/ 2>/dev/null || true

      - name: Upload Full Hardware Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-full-hardware-pack
          path: bin_output/
