name: Build OpenWrt Vince (Port MSM8953)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_UNSAFE_CONFIGURE: 1
  FORK_URL: https://github.com/lkiuyu/immortalwrt
  FORK_BRANCH: master
  WIFI_SSID: OpenWrt-Vince
  WIFI_KEY: ${{ secrets.WIFI_KEY || 'vince12345' }}
  ROOT_PASS: ${{ secrets.ROOT_PASS || 'vince12345' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free Host Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          echo "Disk Space Available:"
          df -h "$GITHUB_WORKSPACE"

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
          autoconf automake libtool gperf help2man intltool patch pkgconf bzip2 xz-utils \
          libelf-dev libdw-dev libncurses-dev libssl-dev libglib2.0-dev libgmp3-dev libmpc-dev \
          libmpfr-dev libreadline-dev libltdl-dev python3 python3-distutils python3-setuptools \
          python3-dev python3-pyelftools python3-ply python3-docutils libpython3-dev re2c squashfs-tools \
          texinfo xmlto cmake ninja-build rsync subversion swig time u-boot-tools device-tree-compiler \
          unzip wget curl zstd flex bison ca-certificates xsltproc zlib1g-dev xxd p7zip-full

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Init Logs
        run: mkdir -p "$GITHUB_WORKSPACE/ci-logs"

      - name: Clone OpenWrt Fork (Fast Shallow Clone)
        run: |
          rm -rf openwrt
          git clone --depth 1 --filter=blob:none -b "$FORK_BRANCH" "$FORK_URL" openwrt

      # CACHE DL DAN TOOLCHAIN SUPAYA TIDAK DOWNLOAD/BUILD ULANG
      - name: Cache OpenWrt DL & Tools
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
            openwrt/staging_dir/host
          key: openwrt-vince-dl-tools-${{ runner.os }}
          restore-keys: |
            openwrt-vince-dl-tools-

      - name: Inject Obstack Fix for Elfutils
        run: |
          cd openwrt
          [ -f tools/elfutils/Makefile ] || exit 0
          python3 -c "
          hook = '''
          define Host/Configure/Pre/FixObstack
          \tsed -i 's/#if @HAVE_OBSTACK_PRINTF@/#if 0/g' \$(HOST_BUILD_DIR)/libgnu/obstack.in.h 2>/dev/null || true
          endef
          Hooks/HostConfigure/Pre += Host/Configure/Pre/FixObstack
          '''
          with open('tools/elfutils/Makefile', 'a') as f:
              f.write(hook)
          "

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          for repo in luci-app-sms-tool-js luci-app-modemband; do
            if [ -z "$(find feeds -maxdepth 4 -type d -name "$repo" -print -quit)" ]; then
              for i in {1..3}; do
                git clone --depth 1 "https://github.com/4IceG/$repo.git" "package/$repo" && break || sleep 2
              done
            fi
          done

      - name: Inject Custom Configurations
        run: |
          cd openwrt
          mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults

          cat << 'CUSTOM_EOF' > files/etc/uci-defaults/99-vince-custom
          #!/bin/sh
          printf '%s\n%s\n' '__ROOT_PASS__' '__ROOT_PASS__' | passwd root >/dev/null 2>&1
          uci set network.lan.ipaddr='192.168.1.1'
          uci commit network
          wifi config
          for i in $(uci show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.=]*\)=wifi-iface$/\1/p'); do
              uci set wireless.$i.mode='ap'
              uci set wireless.$i.ssid='__WIFI_SSID__'
              uci set wireless.$i.key='__WIFI_KEY__'
              uci set wireless.$i.disabled='0'
          done
          uci commit wireless
          exit 0
          CUSTOM_EOF
          sed -i "s#__ROOT_PASS__#${ROOT_PASS}#g; s#__WIFI_SSID__#${WIFI_SSID}#g; s#__WIFI_KEY__#${WIFI_KEY}#g" files/etc/uci-defaults/99-vince-custom
          chmod +x files/etc/uci-defaults/99-vince-custom

      - name: Apply Overlay
        run: |
          if [ -d "$GITHUB_WORKSPACE/overlay" ]; then
            cp -a "$GITHUB_WORKSPACE/overlay/." openwrt/
            rm -f openwrt/README.md
          fi

      - name: Auto Scaffold Subtarget msm8953 + Device Vince
        run: bash ci/scaffold-msm8953.sh openwrt

      - name: Inject Configuration & Lock Target MSM89xx
        run: |
          cd openwrt
          cat << 'CONFIG_EOF' > .config
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8953=y
          CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_AUTOREMOVE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_kmod-wcn36xx=y
          CONFIG_PACKAGE_kmod-usb-gadget-eth=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_EOF

          make defconfig

      # PENGECEKAN PRA-BUILD (Gagal di sini jika ada file/config yang salah)
      - name: Run Pre-flight Inspection
        run: bash ci/inspect-preflight.sh openwrt

      - name: Download Sources (Restored from Cache if Available)
        run: |
          cd openwrt
          make download -j"$(nproc)" WGET="wget --user-agent='Mozilla/5.0'" || make download -j1 V=s

      # BUILD HANYA 1X JALAN
      - name: Build Firmware (Single Pass)
        run: bash ci/build.sh openwrt

      - name: Package Flash Files
        if: success()
        run: bash ci/package-flash.sh openwrt

      - name: Upload Flash Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vince-flash-package
          path: flash-out/

      - name: Upload CI Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
