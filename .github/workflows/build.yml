name: Build OpenWrt Vince Master MSM8953

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Complete Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
          libelf-dev libdw-dev libncurses-dev libssl-dev python3 python3-distutils python3-setuptools \
          python3-dev rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: Clone OpenWrt Repo (MSM89xx Supported Fork)
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/lkiuyu/immortalwrt.git openwrt

      - name: Cache OpenWrt Downloads & Staging Tools
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/include/toplevel.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: Update & Install Feeds + Custom LuCI Apps
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          git clone --depth 1 https://github.com/4nhung/luci-app-sms-tool-js.git package/luci-app-sms-tool-js || true
          git clone --depth 1 https://github.com/4nhung/luci-app-modemband.git package/luci-app-modemband || true

      - name: Inject Configuration & Lock Target MSM8953
        run: |
          cd openwrt
          mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults files/etc/nftables.d files/etc/sysctl.d

          # 1. LED Status Monitor Daemon
          cat << 'LED_SCRIPT' > files/usr/bin/led-status-monitor.sh
          #!/bin/sh
          LED="/sys/class/leds/white:status/brightness"
          [ ! -f "$LED" ] && LED=$(ls /sys/class/leds/*/brightness 2>/dev/null | head -n 1)

          blink() {
              COUNT=$1
              DELAY=${2:-0.2}
              for i in $(seq 1 $COUNT); do
                  echo 255 > "$LED" 2>/dev/null
                  sleep $DELAY
                  echo 0 > "$LED" 2>/dev/null
                  sleep $DELAY
              done
          }

          while true; do
              AP_ACTIVE=$(ubus call network.wireless status 2>/dev/null | grep -c '"up": true')
              SIM_ACTIVE=$(ifconfig wan_sim 2>/dev/null | grep -c 'inet addr')

              if [ "$AP_ACTIVE" -gt 0 ]; then
                  blink 3 0.15
                  sleep 1.5
              elif [ "$SIM_ACTIVE" -gt 0 ]; then
                  blink 1 0.2
                  sleep 1.5
              else
                  blink 5 0.1
                  sleep 1
              fi
          done
          LED_SCRIPT
          chmod +x files/usr/bin/led-status-monitor.sh

          # 2. Layanan Init LED Monitor
          cat << 'LED_SERVICE' > files/etc/init.d/led-status
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              /usr/bin/led-status-monitor.sh &
          }
          LED_SERVICE
          chmod +x files/etc/init.d/led-status

          # 3. Battery Bypass Service
          cat << 'BATTERY_EOF' > files/etc/init.d/battery-bypass
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              if [ -d /sys/class/power_supply/battery ]; then
                  echo 0 > /sys/class/power_supply/battery/charging_enabled 2>/dev/null || true
                  echo 1 > /sys/class/power_supply/battery/input_suspend 2>/dev/null || true
              fi
          }
          BATTERY_EOF
          chmod +x files/etc/init.d/battery-bypass

          # 4. Sysctl BBR
          cat << 'SYSCTL_EOF' > files/etc/sysctl.d/99-network-speed.conf
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          SYSCTL_EOF

          # 5. Skrip uci-defaults Auto Setup
          cat << 'CUSTOM_EOF' > files/etc/uci-defaults/99-vince-custom
          #!/bin/sh
          wifi config
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OpenWrt-Vince'
          uci set wireless.default_radio0.encryption='none'
          uci commit wireless
          wifi reload

          uci set network.wan_sim=interface
          uci set network.wan_sim.proto='modemmanager'
          uci set network.wan_sim.device='/sys/devices/platform/soc/78b7000.usb/modem'
          uci set network.wan_sim.apn='internet'
          uci set network.wan_sim.auth='none'
          uci commit network

          uci set system.@system[0].zram_size_mb='1024'
          uci commit system

          uci set fstab.@global[0].anon_mount='1'
          uci set fstab.@global[0].auto_mount='1'
          uci set fstab.@global[0].auto_swap='1'
          uci commit fstab

          /etc/init.d/battery-bypass enable
          /etc/init.d/battery-bypass start
          /etc/init.d/led-status enable
          /etc/init.d/led-status start
          exit 0
          CUSTOM_EOF
          chmod +x files/etc/uci-defaults/99-vince-custom

          # 6. Firewall TTL 64
          cat << 'NFT_EOF' > files/etc/nftables.d/10-ttl-bypass.nft
          chain mangle_postrouting {
              type filter hook postrouting priority mangle; policy accept;
              ip ttl set 64
              ip6 hoplimit set 64
          }
          NFT_EOF

          # 7. Kunci Target MSM8953 (Snapdragon 625 Vince)
          echo "CONFIG_TARGET_msm89xx=y" > .config
          echo "CONFIG_TARGET_msm89xx_msm8953=y" >> .config
          echo "CONFIG_TARGET_msm89xx_msm8953_DEVICE_xiaomi_vince=y" >> .config

          # Opsi Kompilasi & Modul LuCI Compatibility
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config

          echo "CONFIG_PACKAGE_kmod-wcn36xx=y" >> .config
          echo "CONFIG_PACKAGE_hostapd=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config

          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-travelmate=y" >> .config
          echo "CONFIG_PACKAGE_relayd=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-relay=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-modemband=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sms-tool-js=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-wireguard=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-aria2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-simple-adblock=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-statistics=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_qmi-utils=y" >> .config
          echo "CONFIG_PACKAGE_mbim-utils=y" >> .config
          echo "CONFIG_PACKAGE_sms-tool=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config
          echo "CONFIG_PACKAGE_nftables=y" >> .config
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_wireguard=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          echo "CONFIG_PACKAGE_simple-adblock=y" >> .config
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-f2fs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_fdisk=y" >> .config
          echo "CONFIG_PACKAGE_aria2=y" >> .config

          echo "CONFIG_PACKAGE_bluez-daemon=y" >> .config
          echo "CONFIG_PACKAGE_alsa-utils=y" >> .config
          echo "CONFIG_PACKAGE_pulseaudio-daemon=y" >> .config

          make defconfig

      # --- TAHAP VERIFIKASI PRA-BUILD ---
      - name: Verify Architecture Safety Guard
        run: |
          cd openwrt
          if ! grep -q "CONFIG_TARGET_msm89xx=y" .config; then
            echo "::error::[FATAL ERROR] Arsitektur salah! Target bukan MSM89xx/MSM8953 (Xiaomi Vince)."
            grep "CONFIG_TARGET_" .config | head -n 5
            exit 1
          fi
          echo "::notice::[SUCCESS] Target terverifikasi: MSM89xx / MSM8953 (Xiaomi Vince)."

      - name: Verify Host Prerequisites
        run: |
          cd openwrt
          make prereq

      - name: Download Source Tarballs & Pre-Verify Dependencies
        run: |
          cd openwrt
          make download -j8 || make download -j1

      - name: Pre-extract and Patch Host Tools
        run: |
          cd openwrt
          make tools/elfutils/prepare
          find build_dir/host/elfutils* -type f \( -name "obstack.in.h" -o -name "obstack.h" \) -exec sed -i 's/#if @HAVE_OBSTACK_PRINTF@/#if 0/g' {} +
          find build_dir/host/elfutils* -type f \( -name "obstack.in.h" -o -name "obstack.h" \) -exec sed -i 's/#if $/ #if 0/g' {} +

      # --- KOMPILASI UTAMA ---
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      # --- VERIFIKASI PASCA-BUILD ---
      - name: Verify Generated Image Files
        run: |
          TARGET_DIR="openwrt/bin/targets/msm89xx/msm8953"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::[FATAL ERROR] Folder hasil compile $TARGET_DIR tidak ditemukan!"
            exit 1
          fi

          echo "=== DAFTAR FILE HASIL BUILD ==="
          ls -lh $TARGET_DIR/

          BOOT_EXISTS=$(find $TARGET_DIR -name "*boot*.img" -o -name "*kernel*.bin" -o -name "*vmlinuz*" | head -n 1)
          if [ -z "$BOOT_EXISTS" ]; then
            echo "::error::[FATAL ERROR] File boot/kernel tidak ditemukan di $TARGET_DIR!"
            exit 1
          fi
          echo "::notice::[SUCCESS] File image untuk Xiaomi Vince tervalidasi dan siap dipasang!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-master-firmware
          path: openwrt/bin/targets/
